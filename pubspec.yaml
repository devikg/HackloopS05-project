name: hackloops05_project
description: "SAFE Community - emergency reporting and local awareness."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  supabase_flutter: ^2.8.0
  sqflite: ^2.3.3
  path: ^1.9.0
  http: ^1.2.2
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  nearby_connections: ^4.1.0
  permission_handler: ^11.3.1
  intl: ^0.19.0
  gal: ^2.3.0
  video_player: ^2.9.2
  share_plus: ^10.1.2
  image: ^4.2.0
  video_thumbnail: ^0.5.3
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#2B3A47"
  adaptive_icon_foreground: "assets/icon/app_icon.png"